<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05060f"><title>Your matches – Ghost Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<script src="https://checkout.flutterwave.com/v3.js"></script></head><body data-step="3">
<section><h2>Matches for you</h2><p class="sub" style="margin:-14px 0 20px">People who chose the same path. Unlock a name and photo only for the ones you like.</p><div class="panel" id="ml"></div><a class="btn ghost" href="profile.html" style="margin-top:14px;width:100%">Adjust preferences</a></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="common.js"></script><script src="pay.js"></script><script src="bg.js"></script>
<script>function draw(){const L=list();$("#ml").innerHTML=L.length?L.map(([p,i])=>{const u=S.un.includes(i),s=88+(p[0].length*7+p[3])%10;
return `<div class="m">${u?`<div class="photo">${p[0][0]}</div>`:av(p[0])}<div><b>${u?p[0]:gid(p)}</b> <svg class="i" style="width:15px;height:15px;vertical-align:-2px"><use href="#shield"/></svg><br><span class="chip">${S.it}</span> <span class="chip">${p[3]} cm</span></div><div class="ring" style="--p:${s}"><b>${s}%</b></div><div class="row">${u?"":`<button class="btn ghost sm" onclick="unlock(${i})">Unlock name &amp; photo · ${F(PR.unlock)} TSh</button>`}<button class="btn sm" onclick="interest(${i},this)">Send interest</button></div></div>`}).join(""):"<p class='sub'>No matches yet. Try another path or option.</p>"}
function unlock(i){pay({amount:PR.unlock,what:"unlock",title:"Unlock "+P[i][0]+"'s name and photo",ok:()=>{S.cur=i;S.un.push(i);save();draw()}})}
function interest(i,b){b.textContent="Sending…";b.disabled=true;setTimeout(()=>{S.cur=i;S.t0=Date.now();save();location.href="chat.html"},1000)}
draw();</script></body></html>
