<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05060f"><title>Your privacy – Ghost Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head><body data-step="2">
<section><h2>Set your privacy</h2><div class="panel"><div class="f">
<label>Your name<input id="nm" placeholder="First name" autocomplete="off"></label>
<label>Invite code (optional)<input placeholder="e.g. LADIES2026"></label>
<label>I am looking for<select id="lf"><option value="w">A woman</option><option value="m">A man</option><option value="a">Anyone</option></select></label>
<label>Privacy mode<select><option>Ghost (invisible)</option><option>Masked (partial)</option><option>Open</option></select></label>
<label>Max date budget (TSh)<input id="bd" type="number" value="50000" min="0" step="5000"></label></div>
<label style="display:flex;gap:10px;align-items:center;margin:16px 0"><input id="ag" type="checkbox" style="width:auto"> I confirm I am 18 or older</label>
<button class="btn" style="width:100%" onclick="next()">Find my matches</button></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="common.js"></script><script src="bg.js"></script>
<script>$("#nm").value=S.nm;$("#lf").value=S.lf;$("#bd").value=S.bd;
function next(){if(!$("#ag").checked)return alert("Please confirm you are 18 or older.");S.nm=$("#nm").value.trim();S.lf=$("#lf").value;S.bd=+$("#bd").value||0;save();location.href="matches.html"}</script></body></html>
